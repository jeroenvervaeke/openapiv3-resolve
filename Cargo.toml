[package]
name = "openapiv3-resolve"
version = "0.1.0"
authors = ["Jeroen Vervaeke <crates.contact.6yqd3@8alias.com>"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Reference resolution helpers for the openapiv3 crate."
